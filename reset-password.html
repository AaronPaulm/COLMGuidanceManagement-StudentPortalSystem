<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — COLM Guidance Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <aside class="left-panel">
      <header>
         <img src="images/COLM LOGO.png" alt="COLM Logo" class="logo">
        <h1>College of Our Lady of Mercy of Pulilan Foundation Inc.</h1>
        <hr>
        <p>Guidance Management & Student Portal System</p>
      </header>
    </aside>

    <section class="right-panel">
      <header class="login-greeting">
        <h2>Reset Your Password</h2>
        <p>Choose a new password for your account.</p>
      </header>

      <div id="resetNotice" class="banner" style="display:none;"></div>

      <form id="resetPasswordForm" class="auth-card">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6">

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6">

        <button type="submit" id="resetSubmitBtn">Update Password</button>
        <div class="error-msg" id="resetError" style="display:none;"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("resetError");
      errorEl.style.display = "none";

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Passwords don't match.";
        errorEl.style.display = "block";
        return;
      }

      const btn = document.getElementById("resetSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Updating…";

      // Supabase's client auto-detects the recovery token from the emailed
      // link's URL fragment and opens a temporary session for this call —
      // no manual token handling needed. If the link expired or was already
      // used, this returns an error instead.
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      btn.disabled = false;
      btn.textContent = "Update Password";

      if (error) {
        errorEl.textContent = error.message || "Couldn't update password. The reset link may have expired — request a new one.";
        errorEl.style.display = "block";
        return;
      }

      document.getElementById("resetPasswordForm").style.display = "none";
      const notice = document.getElementById("resetNotice");
      notice.textContent = "Password updated. Redirecting to login…";
      notice.style.display = "flex";

      await supabaseClient.auth.signOut();
      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    });
  </script>
</body>
</html>
