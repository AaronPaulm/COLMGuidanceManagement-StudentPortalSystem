<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="images/COLM LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Reset Password · COLM Guidance Portal</title>
</head>
<body>
  <main class="container">
    <aside class="left-panel">
      <header>
         <img src="images/COLM LOGO.png" alt="COLM Logo" class="logo">
        <h1>College of Our Lady of Mercy of Pulilan Foundation Inc.</h1>
        <hr>
        <p>Guidance Management & Student Portal System</p>
      </header>
    </aside>

    <section class="right-panel">
      <header class="login-greeting">
        <h2>Reset Your Password</h2>
        <p>Choose a new password for your account.</p>
      </header>

      <div id="resetNotice" class="banner" style="display:none;"></div>

      <form id="resetPasswordForm" class="auth-card">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">

        <button type="submit" id="resetSubmitBtn">Update Password</button>
        <div class="error-msg" id="resetError" style="display:none;"></div>
      </form>

      <!-- Shown instead of the password form when the emailed link is
           invalid, expired, or already used. -->
      <div id="resetInvalidPanel" style="display:none;">
        <header class="login-greeting">
          <h3>Reset link not usable</h3>
          <p>This password-reset link is invalid or has expired. You can request a new one below.</p>
        </header>

        <div id="resetInvalidNotice" class="banner" style="display:none;"></div>

        <form id="resendLinkForm" class="auth-card">
          <label for="resendIdentifier">Username</label>
          <input type="text" id="resendIdentifier" name="resendIdentifier" required autocomplete="username" placeholder="Enter your username">

          <button type="submit" id="resendLinkBtn">Send a new link</button>
          <div class="error-msg" id="resendLinkError" style="display:none;"></div>
        </form>

        <a href="index.html" class="link-btn">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const resetPasswordForm = document.getElementById("resetPasswordForm");
    const resetInvalidPanel = document.getElementById("resetInvalidPanel");

    function showResetForm() {
      resetInvalidPanel.style.display = "none";
      resetPasswordForm.style.display = "block";
    }

    function showInvalidPanel() {
      resetPasswordForm.style.display = "none";
      resetInvalidPanel.style.display = "block";
    }

    document.addEventListener("DOMContentLoaded", async () => {
      // The reset link arrives either as a new-style ?token_hash recovery
      // link or as a classic fragment session. Validate whichever format we
      // got so expired/used/invalid links show a clear message instead of
      // silently failing on submit.
      const params = new URLSearchParams(location.search);
      const tokenHash = params.get("token_hash");
      const type = params.get("type");

      if (tokenHash && type === "recovery") {
        const { error } = await supabaseClient.auth.verifyOtp({
          type: "recovery",
          token_hash: tokenHash,
        });
        if (error) {
          showInvalidPanel();
          return;
        }
      }

      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session) {
        showResetForm();
      } else {
        showInvalidPanel();
      }
    });

    resetPasswordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("resetError");
      errorEl.style.display = "none";

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Passwords don't match.";
        errorEl.style.display = "block";
        return;
      }

      const btn = document.getElementById("resetSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Updating…";

      // The recovery token from the emailed link opened a temporary session,
      // so a plain password update applies it to this account. If the link
      // expired or was already used, this returns an error instead.
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      btn.disabled = false;
      btn.textContent = "Update Password";

      if (error) {
        errorEl.textContent = error.message || "Couldn't update password. The reset link may have expired — request a new one below.";
        errorEl.style.display = "block";
        return;
      }

      resetPasswordForm.style.display = "none";
      const notice = document.getElementById("resetNotice");
      notice.textContent = "Password updated. Redirecting to login…";
      notice.style.display = "flex";

      await supabaseClient.auth.signOut();
      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    });

    document.getElementById("resendLinkForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById("resendLinkError");
      const notice = document.getElementById("resetInvalidNotice");
      errorEl.style.display = "none";
      notice.style.display = "none";

      const btn = document.getElementById("resendLinkBtn");
      btn.disabled = true;
      btn.textContent = "Sending…";

      // Map the typed username to the auth email, same as forgot-password.
      const { data: email } = await supabaseClient.rpc("resolve_reset_email", {
        p_username: document.getElementById("resendIdentifier").value.trim(),
      });

      if (email === "__COLM_NO_EMAIL__") {
        btn.disabled = false;
        btn.textContent = "Send a new link";
        errorEl.textContent =
          "That account has no verified personal email yet. Log in and verify your email from the student portal, or contact the guidance office.";
        errorEl.style.display = "block";
        return;
      }

      if (!email) {
        btn.disabled = false;
        btn.textContent = "Send a new link";
        errorEl.textContent = "We couldn't find that username.";
        errorEl.style.display = "block";
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/reset-password.html",
      });

      btn.disabled = false;
      btn.textContent = "Send a new link";

      if (error) {
        errorEl.textContent = error.message || "Something went wrong. Please try again.";
        errorEl.style.display = "block";
        return;
      }

      notice.textContent = "A new reset link is on its way to your inbox. Check your email.";
      notice.style.display = "flex";
      document.getElementById("resendLinkForm").style.display = "none";
    });
  </script>
</body>
</html>
