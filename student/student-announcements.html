<div class="modal-overlay" id="announcementModalOverlay">

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/student-common.js"></script>
  <script>
    let allAnnouncements = [];
    let announcementsByDate = {};
    let viewYear, viewMonth; // viewMonth is 0-indexed
    let selectedDateStr;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function toDateStr(y, m, d) {
      return `${y}-${pad(m + 1)}-${pad(d)}`;
    }

    function todayStr() {
      const t = new Date();
      return toDateStr(t.getFullYear(), t.getMonth(), t.getDate());
    }

    function formatLong(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }

    function formatShort(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric",
      });
    }

    function truncate(str, n) {
      if (!str) return "";
      return str.length > n ? str.slice(0, n).trim() + "…" : str;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function counselorName(a) {
      return a.counselors
        ? `${a.counselors.first_name} ${a.counselors.last_name}`
        : "Guidance Office";
    }

    async function loadAnnouncements() {
      const { data, error } = await supabaseClient
        .from("announcements")
        .select(
          "announcement_id, title, announcement_content, announcement_date, created_at, counselors(first_name, last_name)"
        )
        .order("announcement_date", { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      allAnnouncements = data || [];
      announcementsByDate = {};
      allAnnouncements.forEach((a) => {
        const key = a.announcement_date;
        if (!announcementsByDate[key]) announcementsByDate[key] = [];
        announcementsByDate[key].push(a);
      });

      renderCalendar();
      renderDayList(selectedDateStr);
    }

    function renderCalendar() {
      const grid = document.getElementById("calendarGrid");
      const monthLabel = document.getElementById("calendarMonthLabel");
      const first = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const startOffset = first.getDay();
      const today = todayStr();

      monthLabel.textContent = first.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric",
      });

      grid.innerHTML = "";

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-day empty";
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = toDateStr(viewYear, viewMonth, d);
        const cell = document.createElement("div");
        cell.className = "cal-day";
        cell.textContent = d;

        if (dateStr === today) cell.classList.add("today");
        if (announcementsByDate[dateStr]) cell.classList.add("has-event");
        if (dateStr === selectedDateStr) cell.classList.add("selected");

        cell.addEventListener("click", () => {
          selectedDateStr = dateStr;
          renderCalendar();
          renderDayList(dateStr);
          if (announcementsByDate[dateStr] && announcementsByDate[dateStr].length > 0) {
            openDayModal(dateStr);
          }
        });

        grid.appendChild(cell);
      }
    }

    function renderDayList(dateStr) {
      const list = document.getElementById("announcementsList");
      const label = document.getElementById("selectedDateLabel");
      const items = announcementsByDate[dateStr] || [];

      label.textContent =
        dateStr === todayStr()
          ? `Today's Announcements — ${formatLong(dateStr)}`
          : formatLong(dateStr);

      if (items.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-bullhorn" style="font-size:28px; margin-bottom:10px; color:#d1d5db;"></i>
            <p>No announcements for this day.</p>
          </div>`;
        return;
      }

      list.innerHTML = "";
      items.forEach((a) => {
        const posted = a.counselors
          ? `${a.counselors.first_name} ${a.counselors.last_name}`
          : "Guidance Office";
        const row = document.createElement("div");
        row.className = "staff-list-item";
        row.style.cursor = "pointer";
        row.innerHTML = `
          <div>
            <h3>${escapeHtml(a.title)}</h3>
            <p>${escapeHtml(a.announcement_content)}</p>
            <small>Posted by ${escapeHtml(posted)}</small>
          </div>
        `;
        row.addEventListener("click", () => openAnnouncementModal(a));
        list.appendChild(row);
      });
    }

    function openAnnouncementModal(a) {
      document.getElementById("modalTitle").textContent = a.title;
      document.getElementById("modalBody").innerHTML = `
        <p class="modal-meta">${formatLong(a.announcement_date)} · Posted by ${escapeHtml(counselorName(a))}</p>
        <p class="modal-content-text">${escapeHtml(a.announcement_content)}</p>
      `;
      document.getElementById("announcementModalOverlay").classList.add("show");
    }

    function openDayModal(dateStr) {
      const items = announcementsByDate[dateStr] || [];
      if (items.length === 0) return;

      if (items.length === 1) {
        openAnnouncementModal(items[0]);
        return;
      }

      document.getElementById("modalTitle").textContent = formatLong(dateStr);
      document.getElementById("modalBody").innerHTML = items
        .map(
          (a) => `
        <div class="modal-day-item">
          <h4>${escapeHtml(a.title)}</h4>
          <p class="modal-meta">Posted by ${escapeHtml(counselorName(a))}</p>
          <p class="modal-content-text">${escapeHtml(a.announcement_content)}</p>
        </div>
      `
        )
        .join("");
      document.getElementById("announcementModalOverlay").classList.add("show");
    }

    function closeAnnouncementModal() {
      document.getElementById("announcementModalOverlay").classList.remove("show");
    }

    document.getElementById("modalCloseBtn").addEventListener("click", closeAnnouncementModal);
    document.getElementById("announcementModalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "announcementModalOverlay") closeAnnouncementModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAnnouncementModal();
    });

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      viewMonth--;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      renderCalendar();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      viewMonth++;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      renderCalendar();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      selectedDateStr = todayStr();
      renderCalendar();
      renderDayList(selectedDateStr);
    });

    window.addEventListener("app:notification", (e) => {
      if (e.detail?.type === "announcement") loadAnnouncements();
    });

    (async () => {
      const result = await requireStudentAuth();
      if (!result) return;

      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      selectedDateStr = todayStr();

      // Deep link from a notification: ?date=YYYY-MM-DD (and optionally
      // &id=...) so the student lands on the exact announcement rather
      // than just the announcements page.
      const params = new URLSearchParams(window.location.search);
      const targetDate = params.get("date");
      const targetId = params.get("id");

      if (targetDate) {
        const [y, m, d] = targetDate.split("-").map(Number);
        if (!isNaN(y) && !isNaN(m) && !isNaN(d) && d >= 1 && d <= 31) {
          viewYear = y;
          viewMonth = m - 1;
          selectedDateStr = targetDate;
        }
      }

      await loadAnnouncements();

      if (targetDate && announcementsByDate[targetDate] && announcementsByDate[targetDate].length > 0) {
        const items = announcementsByDate[targetDate];
        const target = targetId ? items.find((a) => String(a.announcement_id) === String(targetId)) : null;
        if (target) openAnnouncementModal(target);
        else openDayModal(targetDate);
      }

      hidePageLoadOverlay();
    })();
  </script>
