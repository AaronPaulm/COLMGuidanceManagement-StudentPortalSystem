  <main class="content">
       
 <header class="GreetingsCard">

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/table-column-resize.js"></script>
  <script src="../js/student-common.js"></script>
  <script src="../js/pagination.js"></script>
  <script>
    let allHistoryItems = [];
    let activeFilter = "all";
    let activeHistorySchoolYear = "all";
    let historyPage = 1;
    const HISTORY_PAGE_SIZE = 20;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function appointmentStatusBadge(status) {
      if (status === "conducted") return { label: "Resolved", cls: "badge-approved" };
      if (status === "declined") return { label: "Declined", cls: "badge-cancelled" };
      if (status === "approved") return { label: "Approved", cls: "badge-approved" };
      if (status === "pending") return { label: "Pending", cls: "badge-info" };
      if (status === "rescheduled") return { label: "Rescheduled", cls: "badge-info" };
      return { label: status, cls: "badge-info" };
    }

    async function loadHistory(studentId) {
      const tbody = document.getElementById("historyTableBody");
      tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Loading…</td></tr>`;

      const [{ data: appts, error: apptErr }, { data: forms, error: formErr }] = await Promise.all([
        supabaseClient
          .from("appointments")
          .select("appointment_id, concern, appointment_date, status, school_year, counselors(first_name, last_name)")
          .eq("student_id", studentId),
        supabaseClient
          .from("form_assignments")
          .select("assignment_id, submitted_at, school_year, forms(form_name)")
          .eq("student_id", studentId)
          .eq("status", "submitted"),
      ]);

      if (apptErr || formErr) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Couldn't load history.</td></tr>`;
        console.error(apptErr || formErr);
        return;
      }

      const apptItems = (appts || []).map((a) => {
        const counselorName = a.counselors ? `${a.counselors.first_name} ${a.counselors.last_name}` : "Guidance Office";
        const badge = appointmentStatusBadge(a.status);
        return {
          type: "appointment",
          date: a.appointment_date,
          category: "Counseling",
          description: a.concern ? `${a.concern} — ${counselorName}` : `Session with ${counselorName}`,
          schoolYear: a.school_year,
          statusLabel: badge.label,
          statusClass: badge.cls,
        };
      });

      const formItems = (forms || []).map((f) => ({
        type: "form",
        date: f.submitted_at,
        category: "Form",
        description: f.forms?.form_name || "Untitled form",
        schoolYear: f.school_year,
        statusLabel: "Submitted",
        statusClass: "badge-approved",
      }));

      allHistoryItems = [...apptItems, ...formItems].sort((a, b) => new Date(b.date) - new Date(a.date));
      populateHistorySchoolYearFilter();
      renderHistoryTable();
    }

    function populateHistorySchoolYearFilter() {
      const select = document.getElementById("historySchoolYearFilter");
      const years = new Set(allHistoryItems.map((i) => i.schoolYear).filter(Boolean));
      const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));

      select.innerHTML =
        `<option value="all">All school years</option>` +
        sortedYears.map((y) => `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join("");
      select.value = sortedYears.includes(activeHistorySchoolYear) ? activeHistorySchoolYear : "all";
    }

    function renderHistoryTable() {
      const tbody = document.getElementById("historyTableBody");
      const pager = document.getElementById("historyPagination");
      let items = activeFilter === "all" ? allHistoryItems : allHistoryItems.filter((i) => i.type === activeFilter);
      if (activeHistorySchoolYear !== "all") {
        items = items.filter((i) => i.schoolYear === activeHistorySchoolYear);
      }

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No records found.</td></tr>`;
        pager.innerHTML = "";
        return;
      }

      historyPage = renderPaginationControls(pager, {
        totalItems: items.length,
        page: historyPage,
        pageSize: HISTORY_PAGE_SIZE,
        onPageChange: (p) => {
          historyPage = p;
          renderHistoryTable();
        },
      });

      tbody.innerHTML = paginateItems(items, historyPage, HISTORY_PAGE_SIZE)
        .map(
          (i) => `
        <tr>
          <td>${formatDate(i.date)}</td>
          <td>${escapeHtml(i.category)}</td>
          <td>${escapeHtml(i.description)}</td>
          <td>${escapeHtml(i.schoolYear || "—")}</td>
          <td><span class="badge ${i.statusClass}">${escapeHtml(i.statusLabel)}</span></td>
        </tr>
      `
        )
        .join("");
    }

    document.getElementById("historyFilterTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      document.querySelectorAll("#historyFilterTabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      historyPage = 1;
      renderHistoryTable();
    });

    document.getElementById("historySchoolYearFilter").addEventListener("change", (e) => {
      activeHistorySchoolYear = e.target.value;
      historyPage = 1;
      renderHistoryTable();
    });

    (async () => {
      const result = await requireStudentAuth();
      if (!result) return;

      await loadHistory(result.student.student_id);
      hidePageLoadOverlay();
    })();
  </script>
