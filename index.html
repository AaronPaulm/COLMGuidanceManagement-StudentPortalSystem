<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="images/COLM LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <title>COLM Guidance Portal</title>
</head>
<body>
  <main class="container">
    <aside class="left-panel">
      <header>
         <img src="images/COLM LOGO.png" alt="COLM Logo" class="logo">
        <h1>College of Our Lady of Mercy of Pulilan Foundation Inc.</h1>
        <hr>
        <p>Guidance Management & Student Portal System</p>
      </header>
    </aside>

    <section class="right-panel">
      <header class="login-greeting">
        <h2>Welcome Back!</h2>
        <p>Sign in to continue to the COLM Guidance Portal</p>
      </header>

      <div id="sessionNotice" class="banner" style="display:none;"></div>

      <nav class="role-switch" aria-label="Login Role">
        <button type="button" id="studentBtn" class="active" data-role="student">Student</button>
        <button type="button" id="counselorBtn" data-role="counselor">Guidance Counselor</button>
      </nav>

      <p id="staffNotice">Sign in as Student</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <div>
          <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn">Login as Student</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(location.search);
      const reason = params.get("reason");

      // Already logged in (e.g. opened a new tab while signed in
      // elsewhere)? Skip straight to the right dashboard instead of
      // showing the login form again. Skip this when a ?reason= is
      // present, though — that means something intentionally sent the
      // user back here (timeout, forbidden, archived) and that message
      // needs to actually be seen, not silently bounced past.
      if (!reason) {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();

        if (session) {
          const { data: userRow } = await supabaseClient
            .from("users")
            .select("role")
            .eq("user_id", session.user.id)
            .maybeSingle();

          const role = userRow?.role?.toLowerCase();
          if (role === "counselor") {
            window.location.href = "counselor/counselor-dashboard.html";
            return;
          }
          if (role === "student") {
            const { data: studentRow } = await supabaseClient
              .from("students")
              .select("email_verified")
              .eq("user_id", session.user.id)
              .maybeSingle();
            window.location.href =
              studentRow?.email_verified === false
                ? "verify-email.html"
                : "student/student-dashboard.html";
            return;
          }
        }
      }

      const notice = document.getElementById("sessionNotice");

      if (reason && notice) {
        const messages = {
          required: "Please sign in to continue.",
          forbidden: "You don't have access to that page with your current role.",
          timeout: "You were signed out due to inactivity. Please sign in again.",
          archived: "This account has been archived. Contact the guidance office if you believe this is a mistake."
        };
        notice.textContent = messages[reason] || "Please sign in to continue.";
        notice.style.display = "flex";
      }

      const form = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");
      const submitBtn = document.getElementById("loginBtn");
      const roleButtons = document.querySelectorAll(".role-switch button");
      const staffNotice = document.getElementById("staffNotice");

      const updateRoleUI = () => {
        const activeBtn = document.querySelector(".role-switch button.active");
        const role = activeBtn ? activeBtn.getAttribute("data-role") : "student";

        if (role === "counselor") {
          staffNotice.textContent = "Sign in as Guidance Counselor";
          submitBtn.textContent = "Login as Guidance Counselor";
        } else {
          staffNotice.textContent = "Sign in as Student";
          submitBtn.textContent = "Login as Student";
        }
      };

      roleButtons.forEach((button) => {
        button.addEventListener("click", () => {
          roleButtons.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          updateRoleUI();
        });
      });

      updateRoleUI();

      // Maps a typed username or email to the address Supabase accepts for
      // sign-in / password reset. Empty result => unknown identifier.
      async function resolveEmailIdentifier(rawIdentifier) {
        if (rawIdentifier.includes("@")) return rawIdentifier;
        const { data } = await supabaseClient.rpc("resolve_username", { p_username: rawIdentifier });
        return data || null;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        const rawIdentifier = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const activeBtn = document.querySelector(".role-switch button.active");
        const selectedRole = activeBtn ? activeBtn.getAttribute("data-role") : "student";

        try {
          // Resolve username -> auth email, or pass email straight through.
          let email = await resolveEmailIdentifier(rawIdentifier);
          if (!email) throw new Error("Invalid email or password.");

          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const { data: userRow, error: userRowError } = await supabaseClient
            .from("users")
            .select("role")
            .eq("user_id", data.user.id)
            .single();
          if (userRowError) throw userRowError;

          const actualRole = userRow?.role?.toLowerCase();

          if (selectedRole !== actualRole) {
            // Destroy the session before erroring — otherwise the account is
            // silently logged in and a refresh bounces to its real dashboard,
            // even though the wrong role was selected. Keep the message
            // generic so a wrong role isn't confirmed to third parties.
            await supabaseClient.auth.signOut();
            throw new Error("Invalid email or password.");
          }

          if (actualRole === "counselor") {
            window.location.href = "counselor/counselor-dashboard.html";
            return;
          }

          // Students whose email isn't verified yet (freshly bulk-imported)
          // land on the verify-email page on first login.
          const { data: studentRow } = await supabaseClient
            .from("students")
            .select("email_verified")
            .eq("user_id", data.user.id)
            .maybeSingle();
          if (studentRow?.email_verified === false) {
            window.location.href = "verify-email.html";
          } else {
            window.location.href = "student/student-dashboard.html";
          }
        } catch (err) {
          // A banned auth account (set when a counselor archives a student)
          // fails right here at sign-in, before we ever get a session to
          // check students.is_archived with — so the only signal available
          // is Supabase's own error text. Give a clear, accurate message
          // instead of leaving people thinking they mistyped their password.
          const isBanned = /banned/i.test(err.message || "");
          errorMsg.textContent = isBanned
            ? "This account has been archived. Contact the guidance office if you believe this is a mistake."
            : err.message || "Invalid email or password.";
          errorMsg.style.display = "block";
          submitBtn.disabled = false;
          updateRoleUI();
        }
      });
    });
  </script>
</body>
</html>
