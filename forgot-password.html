<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="images/COLM LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Forgot Password · COLM Guidance Portal</title>
</head>
<body>
  <main class="container">
    <aside class="left-panel">
      <header>
         <img src="images/COLM LOGO.png" alt="COLM Logo" class="logo">
        <h1>College of Our Lady of Mercy of Pulilan Foundation Inc.</h1>
        <hr>
        <p>Guidance Management & Student Portal System</p>
      </header>
    </aside>

    <section class="right-panel">
      <header class="login-greeting">
        <h2>Forgot Your Password?</h2>
        <p>Enter your username and we'll email you a password-reset link.</p>
      </header>

      <div id="forgotNotice" class="banner" style="display:none;"></div>

      <form id="forgotForm" class="auth-card">
        <label for="forgotIdentifier">Username</label>
        <input type="text" id="forgotIdentifier" name="forgotIdentifier" required autocomplete="username" placeholder="Enter your username">

        <button type="submit" id="forgotSendBtn">Send reset link</button>
        <div class="error-msg" id="forgotError" style="display:none;"></div>
      </form>

      <a href="index.html" class="link-btn">Back to sign in</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById("forgotError");
      const btn = document.getElementById("forgotSendBtn");
      errorEl.style.display = "none";

      // Login is username-based, so map the typed username to the auth email
      // Supabase holds for it before requesting the reset. resolve_reset_email
      // only returns addresses that are verified and non-placeholder — fake
      // internal @colm.edu.ph accounts never get a reset email sent here (see
      // migrations/reset_email_and_profile_sync.sql).
      const { data: email } = await supabaseClient.rpc("resolve_reset_email", {
        p_username: document.getElementById("forgotIdentifier").value.trim(),
      });

      if (email === "__COLM_NO_EMAIL__") {
        errorEl.textContent =
          "That account has no verified personal email yet. Log in and verify your email from the student portal, or contact the guidance office.";
        errorEl.style.display = "block";
        return;
      }

      if (!email) {
        errorEl.textContent = "We couldn't find that username.";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending…";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/reset-password.html",
      });

      btn.disabled = false;
      btn.textContent = "Send reset link";

      if (error) {
        errorEl.textContent = error.message || "Something went wrong. Please try again.";
        errorEl.style.display = "block";
        return;
      }

      const notice = document.getElementById("forgotNotice");
      notice.textContent =
        "If an account exists, a password-reset link has been sent to its email. Students without a personal email on file should see their counselor.";
      notice.style.display = "flex";
      document.getElementById("forgotForm").style.display = "none";
    });
  </script>
</body>
</html>
