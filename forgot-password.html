<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="images/COLM LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Forgot Password · COLM Guidance Portal</title>
</head>
<body>
  <main class="container">
    <aside class="left-panel">
      <header>
         <img src="images/COLM LOGO.png" alt="COLM Logo" class="logo">
        <h1>College of Our Lady of Mercy of Pulilan Foundation Inc.</h1>
        <hr>
        <p>Guidance Management & Student Portal System</p>
      </header>
    </aside>

    <section class="right-panel">
      <header class="login-greeting">
        <h2>Forgot Your Password?</h2>
        <p>Enter your username or email and we'll send you a password-reset link.</p>
      </header>

      <div id="forgotNotice" class="banner" style="display:none;"></div>

      <form id="forgotForm" class="auth-card" data-submit-cooldown="8000">
        <label for="forgotIdentifier">Username or Email</label>
        <input type="text" id="forgotIdentifier" name="forgotIdentifier" required autocomplete="username" placeholder="Enter your username or email">
        <span class="hint">Students: use your username. Guidance personnel: use your email address.</span>

        <button type="submit" id="forgotSendBtn">Send reset link</button>
        <div class="error-msg" id="forgotError" style="display:none;"></div>
      </form>

      <a href="index.html" class="link-btn">Back to sign in</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById("forgotError");
      const btn = document.getElementById("forgotSendBtn");
      if (btn.disabled) return; // already sending — ignore double clicks / Enter
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Sending…";

      // Students log in with a username; guidance personnel use their
      // email. Either works here. resolve_reset_recipient maps the typed
      // identifier to the address Supabase actually holds for the account
      // before requesting the reset — it only returns addresses that are
      // verified and non-placeholder, so fake internal @colm.edu.ph
      // student accounts never get a reset email sent (see
      // migrations/password_reset_email_or_username.sql).
      const { data: email } = await supabaseClient.rpc("resolve_reset_recipient", {
        p_identifier: document.getElementById("forgotIdentifier").value.trim(),
      });

      if (email === "__COLM_NO_EMAIL__") {
        btn.disabled = false;
        btn.textContent = "Send reset link";
        errorEl.textContent =
          "That account has no verified personal email yet. Log in and verify your email from the student portal, or contact the guidance office.";
        errorEl.style.display = "block";
        return;
      }

      if (!email) {
        btn.disabled = false;
        btn.textContent = "Send reset link";
        errorEl.textContent = "We couldn't find that username or email.";
        errorEl.style.display = "block";
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/reset-password.html",
      });

      btn.disabled = false;
      btn.textContent = "Send reset link";

      if (error) {
        errorEl.textContent = error.message || "Something went wrong. Please try again.";
        errorEl.style.display = "block";
        return;
      }

      const notice = document.getElementById("forgotNotice");
      notice.textContent =
        "If an account exists, a password-reset link has been sent to its email. Students without a verified personal email should see their guidance personnel.";
      notice.style.display = "flex";
      document.getElementById("forgotForm").style.display = "none";
    });
  </script>
</body>
</html>
