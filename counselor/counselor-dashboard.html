  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/counselor-common.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    // Fixed order + reserved status colors, consistent with the badges used
    // everywhere else in the app — never color-alone, each bar carries its
    // own text label and count.
    const APPOINTMENT_STATUS_META = [
      { key: "pending", label: "Pending", color: "#f59e0b" },
      { key: "approved", label: "Approved", color: "#22c55e" },
      { key: "completed", label: "Completed", color: "#4338ca" },
      { key: "declined", label: "Declined", color: "#ef4444" },
      { key: "cancelled", label: "Cancelled", color: "#9ca3af" },
    ];

    const CASE_STATUS_META = [
      { key: "open", label: "Open", color: "#f59e0b" },
      { key: "monitoring", label: "Monitoring", color: "#3b82f6" },
      { key: "resolved", label: "Resolved", color: "#22c55e" },
    ];

    function renderStatusChart(containerId, counts, meta) {
      const container = document.getElementById(containerId);
      const total = meta.reduce((sum, m) => sum + (counts[m.key] || 0), 0);

      if (total === 0) {
        container.innerHTML = `<div class="notif-empty" style="padding:12px 0;">No data yet.</div>`;
        return;
      }

      container.innerHTML = meta
        .map((m) => {
          const value = counts[m.key] || 0;
          const pct = total ? Math.round((value / total) * 100) : 0;
          return `
            <div class="status-bar-row">
              <div class="status-bar-label">${escapeHtml(m.label)}</div>
              <div class="status-bar-track">
                <div class="status-bar-fill" style="width:${pct}%; background:${m.color};"></div>
              </div>
              <div class="status-bar-value">${value}</div>
            </div>
          `;
        })
        .join("");
    }

    function countByStatus(rows) {
      const counts = {};
      (rows || []).forEach((r) => {
        counts[r.status] = (counts[r.status] || 0) + 1;
      });
      return counts;
    }

    function firstOfMonthStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function tomorrowStr() {
      const t = new Date();
      t.setDate(t.getDate() + 1);
      return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    }

    async function loadDashboardAnalytics(counselorId) {
      const [
        { count: pendingCount },
        { count: openCasesCount },
        { count: studentsCount },
        { count: completedThisMonthCount },
        { data: appointmentStatuses },
        { data: caseStatuses },
        { count: tomorrowCount },
      ] = await Promise.all([
        supabaseClient
          .from("appointments")
          .select("appointment_id", { count: "exact", head: true })
          .eq("counselor_id", counselorId)
          .eq("status", "pending"),
        supabaseClient
          .from("cases")
          .select("case_id", { count: "exact", head: true })
          .eq("counselor_id", counselorId)
          .neq("status", "resolved"),
        supabaseClient.from("students").select("student_id", { count: "exact", head: true }).eq("is_archived", false),
        supabaseClient
          .from("appointments")
          .select("appointment_id", { count: "exact", head: true })
          .eq("counselor_id", counselorId)
          .eq("status", "completed")
          .gte("appointment_date", firstOfMonthStr()),
        supabaseClient.from("appointments").select("status").eq("counselor_id", counselorId),
        supabaseClient.from("cases").select("status").eq("counselor_id", counselorId),
        // Deployment-free stand-in for automated reminders (see the same
        // note in student-dashboard.html) — surfaces tomorrow's approved
        // load the moment the counselor opens their dashboard, no cron
        // deployment required.
        supabaseClient
          .from("appointments")
          .select("appointment_id", { count: "exact", head: true })
          .eq("counselor_id", counselorId)
          .eq("status", "approved")
          .eq("appointment_date", tomorrowStr()),
      ]);

      document.getElementById("statPending").textContent = pendingCount ?? 0;
      document.getElementById("statOpenCases").textContent = openCasesCount ?? 0;
      document.getElementById("statStudents").textContent = studentsCount ?? 0;
      document.getElementById("statCompleted").textContent = completedThisMonthCount ?? 0;

      renderStatusChart("apptStatusChart", countByStatus(appointmentStatuses), APPOINTMENT_STATUS_META);
      renderStatusChart("caseStatusChart", countByStatus(caseStatuses), CASE_STATUS_META);

      const banner = document.getElementById("counselorReminderBanner");
      banner.innerHTML = tomorrowCount
        ? `<div class="form-note-banner"><i class="fa-solid fa-bell"></i> Reminder: you have ${tomorrowCount} appointment${tomorrowCount === 1 ? "" : "s"} scheduled tomorrow.</div>`
        : "";
    }

    (async () => {
      const result = await requireCounselorAuth();
      if (!result) return;

      const { counselor } = result;
      document.getElementById("welcomeMsg").textContent =
        `Welcome, ${counselor.first_name} ${counselor.last_name}. Here's how things are looking today.`;

      hidePageLoadOverlay();
      await loadDashboardAnalytics(counselor.counselor_id);
    })();
  </script>
